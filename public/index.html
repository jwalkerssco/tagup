<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tagup — Prices today. On shelf tomorrow.</title>
<meta name="description" content="Reps ask for price tags and shelf signs from their phone. The sign shop prints them in every chain's own style. tagup is the price tag request app for beverage distributors.">
<meta name="theme-color" content="#FAF7F2">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Oswald:wght@500;700&family=Bebas+Neue&family=Anton&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #FAF7F2; color: #14110F; font-family: Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  #root { min-height: 100%; }
  * { box-sizing: border-box; }
  input, select, button, textarea { font-family: inherit; }
  a { color: inherit; }
  ::selection { background: #FFE3D0; }
  @keyframes tu-fade { from { opacity: 0; } to { opacity: 1; } }  /* opacity only: a transform here makes Chrome treat the pane as the containing block for position:fixed, and a modal then centers inside a 40,000px-tall table instead of the window (2026-09-24) */
  .tu-fade { animation: tu-fade .28s ease-out both; }
  @media print { body { background: #fff; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="/bundle.js"></script>
</body>
</html>
